var bytes=new Uint8Array(32);crypto.getRandomValues(bytes);var bridge=Array.from(bytes,function(b){return b.toString(16).padStart(2,'0');}).join('');
var frame=document.createElement('iframe');frame.title='Тренировочный план';frame.referrerPolicy='no-referrer';frame.src=webUrl+'?channel=telegram&bridge='+bridge;
var peer=null;
var timer=setTimeout(function(){document.getElementById('caption').textContent='Google отвечает дольше обычного. Закройте окно и попробуйте снова.';},45000);
window.addEventListener('message',function(e){
  if(!e.data||['gudron-tg-ready120','gudron-tg-visible121'].indexOf(e.data.type)<0||e.data.bridge!==bridge||!/^https:\/\/(?:[a-z0-9-]+-)?script\.googleusercontent\.com$/.test(e.origin)||!e.source)return;
  if(peer&&e.source!==peer)return;peer=e.source;
  if(e.data.type==='gudron-tg-visible121'){clearTimeout(timer);message.hidden=true;return;}
  e.source.postMessage({type:'gudron-tg-init120',bridge:bridge,initData:app.initData},e.origin);
});
document.body.appendChild(frame);
})();
